<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Vellix TipTap</title>
    <style>
      @font-face {
        font-family: "HachiMaruPop";
        src: url("penned-font://document/HachiMaruPop-Regular.ttf") format("truetype"), url("./fonts/HachiMaruPop-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "HachiMaruPop";
        src: url("penned-font://document/HachiMaruPop-SyntheticBold.ttf?v=2") format("truetype"), url("./fonts/HachiMaruPop-SyntheticBold.ttf?v=2") format("truetype");
        font-weight: 600 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "HachiMaruPop";
        src: url("penned-font://document/HachiMaruPop-SyntheticItalic.ttf") format("truetype"), url("./fonts/HachiMaruPop-SyntheticItalic.ttf") format("truetype");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "HachiMaruPop";
        src: url("penned-font://document/HachiMaruPop-SyntheticBoldItalic.ttf?v=2") format("truetype"), url("./fonts/HachiMaruPop-SyntheticBoldItalic.ttf?v=2") format("truetype");
        font-weight: 600 900;
        font-style: italic;
        font-display: swap;
      }
      html[style*="HachiMaruPop"] {
        --vellix-code-font-family: "HachiMaruPop", cursive;
      }
      html[style*="HachiMaruPop"] .tiptap-editor {
        font-synthesis: none;
      }
      html[style*="HachiMaruPop"] .tiptap-editor :is(code, pre) {
        font-family: var(--vellix-font-family) !important;
      }
      :root {
        color: #f7f7f7;
        background: transparent;
        font-family:
          ui-rounded,
          -apple-system-rounded,
          "SF Pro Rounded",
          "SF Pro Display",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --vellix-page-background: transparent;
        --vellix-primary-text: #f7f7f7;
        --vellix-neutral-rgb: 255,255,255;
        --vellix-link-color: #8fe9ff;
        --vellix-interface-surface: #242424;
        --vellix-interface-ink: #f3f3f3;
        --vellix-secondary-text: #9b9b9f;
        --vellix-font-family:
          ui-rounded,
          -apple-system-rounded,
          "SF Pro Rounded",
          "SF Pro Display",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        --vellix-selection-fill: #0d5668;
        --vellix-selection-dot: #2ecbff;
        --vellix-selection-soft: rgba(46, 203, 255, 0.12);
        --vellix-selection-softer: rgba(46, 203, 255, 0.075);
        --vellix-selection-edge: rgba(46, 203, 255, 0.28);
        --vellix-icon-chevleft: url("vellix-icon://asset/chevleft?tint=%23FFFFFF&size=22");
        --vellix-icon-chevright: url("vellix-icon://asset/chevright?tint=%23FFFFFF&size=22");
        --vellix-icon-chevdown: url("vellix-icon://asset/chevdown?tint=%23FFFFFF&size=22");
        --vellix-icon-chevup: url("vellix-icon://asset/chevup?tint=%23FFFFFF&size=22");
        --vellix-icon-checkwavy: url("vellix-icon://asset/checkwavy?tint=%23FFFFFF&size=22");
        --vellix-icon-xmarkwavy: url("vellix-icon://asset/xmarkwavy?tint=%23FFFFFF&size=22");
        --vellix-icon-numcal: url("vellix-icon://asset/numcal?tint=%23FFFFFF&size=22");
        --vellix-icon-link: url("vellix-icon://asset/link?tint=%23FFFFFF&size=22");
        --vellix-property-accent: #b59ad9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #editor-root {
        width: 100%;
        min-width: 100%;
        height: auto !important;
        min-height: 0 !important;
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: visible !important;
        overscroll-behavior: none;
      }

      body {
        color: var(--vellix-primary-text);
        font-family: var(--vellix-font-family) !important;
        -webkit-text-size-adjust: 100%;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .vellix-editor-shell,
      .vellix-editor-page {
        width: 100%;
        height: auto !important;
        min-height: 0 !important;
        margin: 0;
        padding: 0;
        background: transparent !important;
        color: var(--vellix-primary-text);
        font-family: var(--vellix-font-family) !important;
        overflow: visible !important;
      }

      .tiptap-editor,
      .ProseMirror {
        font-family: var(--vellix-font-family) !important;
      }

      .tiptap-editor,
      .ProseMirror {
        height: auto !important;
        min-height: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        color: var(--vellix-primary-text) !important;
        overflow: visible !important;
        caret-color: var(--lg-caret-ink, var(--vellix-primary-text));
        outline: none;
      }

      .vellix-editor-page {
        max-width: 720px;
        margin: 0 auto;
      }

      .tiptap-editor {
        --vellix-indent-step: 18px;
        --vellix-toggle-marker-width: 28px;
        --vellix-toggle-column-gap: 8px;
        --vellix-toggle-body-inset: calc(var(--vellix-toggle-marker-width) + var(--vellix-toggle-column-gap));
        font-size: 14px;
        font-weight: 400;
        line-height: 1.52 !important;
        padding-bottom: 1px !important;
      }

      .tiptap-editor [data-vellix-block-id] {
        position: relative;
        width: 100%;
        color: var(--vellix-primary-text);
        transition: none !important;
        touch-action: pan-y;
      }

      .tiptap-editor [data-vellix-selection-block="true"] {
        position: relative;
        z-index: 0;
      }

      .tiptap-editor p,
      .tiptap-editor li,
      .tiptap-editor blockquote,
      .tiptap-editor h1,
      .tiptap-editor h2,
      .tiptap-editor h3,
      .tiptap-editor h4,
      .tiptap-editor h5,
      .tiptap-editor h6 {
        margin: 0;
        padding: 2px 0;
      }

      .tiptap-editor [data-vellix-align="left"] {
        text-align: left;
      }

      .tiptap-editor [data-vellix-align="center"] {
        text-align: center;
      }

      .tiptap-editor [data-vellix-align="right"] {
        text-align: right;
      }

      .tiptap-editor [data-vellix-align="justify"] {
        text-align: justify;
      }

      .tiptap-editor [data-vellix-indent="1"] {
        --vellix-block-indent: var(--vellix-indent-step);
        margin-left: var(--vellix-block-indent);
      }

      .tiptap-editor [data-vellix-indent="2"] {
        --vellix-block-indent: 36px;
        margin-left: var(--vellix-block-indent);
      }

      .tiptap-editor [data-vellix-indent="3"] {
        --vellix-block-indent: 54px;
        margin-left: var(--vellix-block-indent);
      }

      .tiptap-editor [data-vellix-indent="4"] {
        --vellix-block-indent: 72px;
        margin-left: var(--vellix-block-indent);
      }

      .tiptap-editor [data-vellix-indent="5"] {
        --vellix-block-indent: 90px;
        margin-left: var(--vellix-block-indent);
      }

      .tiptap-editor [data-vellix-indent="6"] {
        --vellix-block-indent: 108px;
        margin-left: var(--vellix-block-indent);
      }

      .tiptap-editor h1,
      .tiptap-editor h2,
      .tiptap-editor h3,
      .tiptap-editor h4,
      .tiptap-editor h5,
      .tiptap-editor h6 {
        font-family: var(--vellix-font-family) !important;
        font-weight: 800;
        letter-spacing: 0 !important;
        line-height: 1.24 !important;
      }

      .tiptap-editor h1 { font-size: 24px; }
      .tiptap-editor h2 { font-size: 21px; }
      .tiptap-editor h3 { font-size: 18px; }
      .tiptap-editor h4 { font-size: 16px; }
      .tiptap-editor h5 { font-size: 16px; }
      .tiptap-editor h6 { font-size: 16px; }

      .tiptap-editor .penned-heading-label {
        --label-tail: 15px;
        padding-block: 4px;
      }
      .tiptap-editor .penned-heading-label[data-label-alignment="left"] { text-align: left; }
      .tiptap-editor .penned-heading-label[data-label-alignment="center"] { text-align: center; }
      .tiptap-editor .penned-heading-label[data-label-alignment="right"] { text-align: right; }
      .tiptap-editor .penned-heading-label .penned-label-tile {
        position: relative; isolation: isolate; vertical-align: top;
        display: inline-flex; align-items: center; gap: .45em; max-width: 100%;
        padding: .38em .78em; box-sizing: border-box; min-height: 1.98em; min-width: min(2.75em, 100%);
        background-color: var(--label-grain-base, var(--label-bg)); border: var(--label-border-width, 1px) solid var(--label-border); border-radius: 10px;
        color: var(--label-text);
        -webkit-touch-callout: none;
      }
      .tiptap-editor .penned-heading-label .penned-label-text,
      .tiptap-editor .penned-heading-label .penned-label-text * {
        font-family: var(--label-font, var(--vellix-font-family)) !important;
      }
      .penned-label-text { min-width: 0; overflow-wrap: anywhere; }
      .penned-label-icon {
        flex: 0 0 1em; width: 1em; height: 1em; background: var(--label-icon);
        -webkit-mask: var(--label-mask) center / contain no-repeat;
        mask: var(--label-mask) center / contain no-repeat;
      }
      .tiptap-editor [data-label-shape="rectangular"] .penned-label-tile {
        min-width: min(6em, 100%); padding-inline: 1.08em; border-radius: 12px;
      }
      .tiptap-editor [data-label-shape="pill"] .penned-label-tile { border-radius: 999px; padding-inline: 1.05em; }
      .tiptap-editor [data-label-shape="ribbon"] .penned-label-tile {
        border-radius: 4px; margin-inline: var(--label-tail); max-width: calc(100% - 2 * var(--label-tail));
      }
      .tiptap-editor [data-label-shape="ribbon"] .penned-label-tile::before,
      .tiptap-editor [data-label-shape="ribbon"] .penned-label-tile::after {
        content: ""; position: absolute; pointer-events: none; width: var(--label-tail);
        top: 24%; bottom: -4px; background: var(--label-accent);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 31% 50%);
      }
      .tiptap-editor [data-label-shape="ribbon"] .penned-label-tile::before { right: 100%; }
      .tiptap-editor [data-label-shape="ribbon"] .penned-label-tile::after { left: 100%; transform: scaleX(-1); }
      .tiptap-editor [data-label-shape="framed"] .penned-label-tile {
        --label-frame-outset: calc(var(--label-border-width, 1px) / 2);
        border: 0; padding-inline: 1.25em; border-radius: 0; background: none;
        margin: var(--label-frame-outset);
        max-width: calc(100% - 2 * var(--label-frame-outset));
      }
      .tiptap-editor [data-label-shape="framed"] .penned-label-tile::before {
        /* Clip the fill only; the outline must be free to straddle the edge. */
        content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        clip-path: var(--label-plaque); background-color: var(--label-grain-base, var(--label-bg));
      }
      .tiptap-editor .penned-label-frame {
        position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;
        fill: none; stroke: var(--label-border); stroke-width: var(--label-border-width, 1px);
      }
      .tiptap-editor .penned-label-glass-material {
        /* Lunixia's BubblyIconMaterial, using backdrop blur for the native glass layer. */
        --label-glass-tint: color-mix(in srgb, var(--label-bg) 75%, transparent);
        position: absolute; inset: 0; z-index: -1; pointer-events: none;
        border-radius: inherit; container-type: size;
        background: var(--label-glass-tint);
        -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      }
      .tiptap-editor [data-label-shape="framed"] .penned-label-glass-material {
        clip-path: var(--label-plaque);
      }
      .tiptap-editor .penned-label-glass-material::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background-color: var(--label-glass-tint);
        background-image:
          linear-gradient(calc(180deg - atan2(50cqw, 100cqh)), transparent, var(--label-glass-tint), rgb(13 12 18 / 18%)),
          linear-gradient(calc(180deg - atan2(100cqw, 100cqh)), rgb(247 245 250 / 28.9%), rgb(247 245 250 / 8.5%), transparent),
          radial-gradient(circle 78cqmin at 22% 18%, rgb(247 245 250 / 40.8%), rgb(247 245 250 / 13.6%), transparent);
        background-blend-mode: multiply, screen, screen;
      }
      .tiptap-editor .penned-label-glass-material::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background: linear-gradient(to bottom, rgb(255 255 255 / 78%) 0%, rgb(255 255 255 / 46%) 8%,
          rgb(255 255 255 / 18%) 22%, transparent 46% 65%, rgb(13 12 18 / 12%) 86%, rgb(13 12 18 / 34%) 100%);
      }

      .tiptap-editor [data-label-shape="framed"] .penned-label-grain {

      .tiptap-editor .vellix-plain-callout { --penned-callout-width: initial; }
      .penned-callout-row {
        display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px;

      }
      .penned-callout-row-content { display: contents; }
      .tiptap-editor .penned-callout-row-content > *, .penned-callout-space {

      }
      .tiptap-editor .penned-callout-row-content > .vellix-plain-callout {
        flex: 0 0 calc(var(--penned-callout-width, 100%) - var(--penned-callout-gap-share) - var(--penned-callout-inset));
        min-width: min(120px, var(--penned-callout-available-width));
        width: auto;
      }
      .tiptap-editor .vellix-plain-callout[data-callout-width]:not(.penned-callout-row-content > *) {
        width: var(--penned-callout-width, 100%);
      }
      .tiptap-editor :is(.vellix-plain-callout, .penned-icon-callout, .penned-callout-row):not([data-vellix-indent]) {
        --vellix-block-indent: 0px;
      }
      .tiptap-editor :is(.vellix-plain-callout, .penned-icon-callout, .penned-callout-row) {
        --penned-callout-inset: var(--vellix-block-indent, 0px);
        --penned-callout-available-width: max(0px, calc(100% - var(--penned-callout-inset)));
        box-sizing: border-box;
        margin-left: var(--penned-callout-inset);
        max-width: var(--penned-callout-available-width);
      }
      .tiptap-editor .vellix-toggle-content > :is(.vellix-plain-callout, .penned-icon-callout, .penned-callout-row),
      .tiptap-editor :is(.vellix-toggle-content > .penned-callout-row, .penned-callout-row[data-legacy-toggle-body]) > .penned-callout-row-content > .vellix-plain-callout:not([data-legacy-toggle-body]) {
        --penned-callout-inset: max(0px, calc(var(--vellix-block-indent, 0px) - var(--vellix-indent-step)));
      }
      /* Legacy siblings sit outside the toggle's grid; give them its body inset. */
      .tiptap-editor :is(.vellix-plain-callout, .penned-icon-callout, .penned-callout-row)[data-legacy-toggle-body] {
        --penned-callout-inset: calc(var(--vellix-toggle-body-inset) + max(0px, calc(var(--vellix-block-indent, 0px) - var(--vellix-indent-step))));
      }
      .tiptap-editor .vellix-toggle-content > :is(.vellix-plain-callout:not([data-callout-width]), .penned-icon-callout, .penned-callout-row) {

      .penned-callout-space { min-height: 44px; align-self: stretch; cursor: text; }

      .vellix-page-reference { min-width: 0; margin: 0; padding: 2px 0; }

      .vellix-page-reference-button {
        display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px;

      .vellix-page-thumbnail {

      .vellix-page-reference-excerpt { font-size: 14px; line-height: 1.3; opacity: 0.48; }
      .vellix-page-reference-title, .vellix-page-reference-excerpt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vellix-page-card { padding: 6px 0; }
      /* Override the editor's generic [data-vellix-block-id] width, as callout rows do. */
      .tiptap-editor .vellix-page-reference.vellix-page-card {
        display: inline-block; vertical-align: top;
        width: var(--vellix-page-card-width, 154px); max-width: 100%;
        margin-inline-end: clamp(0px, calc(50% - var(--vellix-page-card-width, 154px)), 12px);
      }

      }

      .tiptap-editor .vellix-page-card-inline > .vellix-page-reference-button { width: 100% !important; }
      .tiptap-editor .vellix-page-reference.vellix-page-card:has(> .vellix-page-reference-button[style*="width: 100%"]) {
        display: block; width: 100%; margin-inline-end: 0;

      .tiptap-editor .vellix-page-reference[hidden] { display: none !important; }

      .penned-minimal-fields {

      .penned-minimal-fields[data-mf-uppercase="true"] .penned-minimal-label { text-transform: uppercase; }
      .penned-minimal-value {
        color: var(--mf-value-color, #e4e4ea);
        font-size: var(--mf-value-size, 15px);
        line-height: 1.4;
        margin-top: 2px;
        min-width: 0;
      }
      .tiptap-editor .penned-minimal-value > p {

        font-size: var(--mf-value-size, 15px);
        margin: 0;
        min-width: 0;

      .penned-minimal-value > *:first-child { margin-top: 0; }
      .penned-minimal-value > *:last-child { margin-bottom: 0; }

  <body>
    <main id="editor-root" class="vellix-editor-shell">
      <div class="vellix-editor-page">
        <div id="editor"></div>
      </div>
    </main>
    <script>
      (() => {
        const root = document.getElementById("editor");
        const style = document.createElement("style");
        document.head.append(style);
        const sheet = style.sheet;
        const rules = new Map();
        let frame = 0;
        let measurePending = false;

        function firstLineAlignment(text) {
          const first = [...text.querySelectorAll("p,h1,h2,h3,h4,h5,h6,pre")]
            .find((element) => element.getClientRects().length &&
              !element.closest('[contenteditable="false"]'));
          if (!first) return null;
          const walker = document.createTreeWalker(first, NodeFilter.SHOW_TEXT);
          const range = document.createRange();
          let top = null;
          let bottom = null;
          let node;
          while ((node = walker.nextNode())) {
            if (!node.textContent || node.parentElement.closest('[contenteditable="false"]')) continue;
            range.selectNodeContents(node);
            for (const rect of range.getClientRects()) {
              if (!rect.height || !rect.width) continue;
              if (top === null) {
                top = rect.top;
                bottom = rect.bottom;
              } else if (rect.top < bottom && rect.bottom > top) {
                top = Math.min(top, rect.top);
                bottom = Math.max(bottom, rect.bottom);
              }
            }
          }
          // Ignore our own offset so the next measurement cannot feed it back
          // into the layout. Measure the first line, not the full text height.
          const textTop = text.getBoundingClientRect().top + parseFloat(getComputedStyle(text).paddingTop);
          if (top !== null) return { populated: true, anchor: top - textTop };
          const emptyLine = first.querySelector("br")?.getBoundingClientRect();
          if (emptyLine?.height) return { populated: false, anchor: emptyLine.top + emptyLine.height / 2 - textTop };
          const firstStyle = getComputedStyle(first);
          return { populated: false, anchor: first.getBoundingClientRect().top - textTop +
            parseFloat(firstStyle.borderTopWidth) + parseFloat(firstStyle.paddingTop) +
            (parseFloat(firstStyle.lineHeight) || parseFloat(firstStyle.fontSize) * 1.52) / 2 };
        }

        function update() {
          frame = 0;
          // firstLineAlignment forces a synchronous layout, so only measure when
          // geometry may have changed (a resize, a font load, or a new/changed
          // callout) rather than on every DOM mutation. Rule structure (adding and
          // removing per-callout rules, the icon) is kept in sync cheaply regardless.
          let measure = measurePending;
          measurePending = false;
          const active = new Set();
          const measurements = [];
          for (const callout of root.querySelectorAll(".vellix-callout")) {
            const id = callout.dataset.vellixBlockId;
            const text = callout.querySelector(":scope > .vellix-callout-text");
            if (!id || !text) continue;
            active.add(id);
            let entry = rules.get(id);
            if (!entry) {
              const index = sheet.insertRule(
                `.vellix-callout[data-vellix-block-id="${CSS.escape(id)}"] {}`,
                sheet.cssRules.length,
              );
              entry = { rule: sheet.cssRules[index], text, alignment: null };
              rules.set(id, entry);
              resize.observe(text);
              measure = true;
            } else if (entry.text !== text) {
              resize.unobserve(entry.text);
              entry.text = text;
              resize.observe(text);
              measure = true;
            }
            const icon = (callout.dataset.calloutIcon || "sparkle").trim() || "sparkle";
            if (entry.icon !== icon) {
              entry.icon = icon;
              entry.rule.style.setProperty(
                "--vellix-callout-icon-mask",
                `var(--vellix-asset-${CSS.escape(icon)}, var(--vellix-asset-sparkle))`,
              );
            }
            if (!measure) continue;
            const alignment = firstLineAlignment(text);
            if (alignment !== null && Number.isFinite(alignment.anchor) &&
                (entry.alignment === null || entry.alignment.populated !== alignment.populated ||
                  Math.abs(alignment.anchor - entry.alignment.anchor) > 0.03)) {
              measurements.push([entry, alignment]);
            }
          }
          // Keep presentation outside ProseMirror's DOM so measuring never changes the document.
          for (const [entry, alignment] of measurements) {
            entry.alignment = alignment;
            // Populated text aligns to the whole icon box's top. Preserve the
            // existing centered caret calculation only for the empty state.
            entry.rule.style.setProperty("--vellix-callout-text-offset", `${alignment.populated ? 0 : Math.max(0, 21 - alignment.anchor)}px`);
            entry.rule.style.setProperty("--vellix-callout-icon-offset", `${alignment.populated ? Math.max(0, alignment.anchor) : Math.max(0, alignment.anchor - 21)}px`);
          }
          for (const [id, entry] of rules) {
            if (active.has(id)) continue;
            resize.unobserve(entry.text);
            const index = [...sheet.cssRules].indexOf(entry.rule);
            if (index >= 0) sheet.deleteRule(index);
            rules.delete(id);
          }
        }

        function schedule(measure) {
          if (measure) measurePending = true;
          if (!frame) frame = requestAnimationFrame(update);
        }
        // A callout's own text box resizing (wrapping, a line added or removed) is
        // what actually changes its first-line alignment, and this per-text observer
        // catches exactly that — so it requests a measure.
        const resize = new ResizeObserver(() => schedule(true));
        resize.observe(root);
        // Structure only: detect added/removed callouts and icon changes. NOT
        // characterData — typing that does not resize a callout cannot change its
        // alignment, so it must not force a layout measurement on every keystroke.
        new MutationObserver(() => schedule(false)).observe(root, {
          subtree: true, childList: true, attributes: true, attributeFilter: ["data-callout-icon"],
        });
        new MutationObserver(() => schedule(true)).observe(document.documentElement, {
          attributes: true, attributeFilter: ["style"],
        });
        window.addEventListener("resize", () => schedule(true));
        document.fonts.addEventListener("loadingdone", () => schedule(true));
        document.fonts.ready.then(() => schedule(true));
        schedule(true);
      })();
    </script>
    <style>
      .penned-inline-tag { color: var(--vellix-property-accent); background: rgba(181,154,217,.12); border-radius: 4px; padding: 0 2px; cursor: pointer; font-weight: 600; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
      .penned-inline-tag:focus-visible { outline: 2px solid #b59ad9; outline-offset: 2px; }
      .penned-tag-suggestions { position: absolute; z-index: 10000; box-sizing: border-box; max-height: 220px; overflow-y: auto; padding: 6px; background: var(--vellix-interface-surface); border: 1px solid rgba(var(--vellix-neutral-rgb), .12); border-radius: 12px; box-shadow: 0 8px 24px #0006; font: 15px -apple-system, sans-serif; }
      .penned-tag-suggestions button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--vellix-interface-ink); border-radius: 6px; padding: 10px 12px; font: inherit; overflow-wrap: anywhere; }
      .penned-tag-suggestions button[aria-selected=true] { background: rgba(181,154,217,.18); color: var(--vellix-property-accent); }
      .penned-tag-destination { animation: penned-tag-arrival 2.4s ease-out; }
      @keyframes penned-tag-arrival { 0%,35% { background-color: rgba(181,154,217,.22); } 100% { background-color: transparent; } }
      @media (prefers-reduced-motion: reduce) { .penned-tag-destination { animation-timing-function: step-end; } }
    </style>
    <style>
      /* Code blocks and their token spans must not inherit the document font. */
      .tiptap-editor .penned-code-viewer,
      .tiptap-editor .penned-code-viewer * {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important;
      }
      .tiptap-editor .penned-code-viewer {
        --penned-code-background: var(--penned-code-background-dark);
        --penned-code-text: var(--penned-code-text-dark);
        --penned-code-gutter: var(--penned-code-gutter-dark);
        --penned-code-lineNumber: var(--penned-code-lineNumber-dark);
        --penned-code-selection: var(--penned-code-selection-dark);
        --penned-code-keyword: var(--penned-code-keyword-dark);
        --penned-code-string: var(--penned-code-string-dark);
        --penned-code-comment: var(--penned-code-comment-dark);
        --penned-code-number: var(--penned-code-number-dark);
        --penned-code-type: var(--penned-code-type-dark);
        --penned-code-function: var(--penned-code-function-dark);
        --penned-code-variable: var(--penned-code-variable-dark);
        --penned-code-operator: var(--penned-code-operator-dark);
        min-width: 0; max-width: 100%; max-height: 580px;
        overflow-x: hidden; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-block: 9px; margin: 12px 0;
        box-sizing: border-box; border: 1px solid color-mix(in srgb, var(--penned-code-text) 13%, transparent);
        border-radius: 8px; background: var(--penned-code-background); color: var(--penned-code-text);
        background-image: linear-gradient(to right, var(--penned-code-gutter) var(--penned-code-gutter-width), transparent 0);
        font-size: 13px;
        line-height: 1.55;
        font-variant-ligatures: none;
        tab-size: 4; cursor: pointer;
      }
      :root[data-penned-interface-scheme="light"] .tiptap-editor .penned-code-viewer {
        --penned-code-background: var(--penned-code-background-light);
        --penned-code-text: var(--penned-code-text-light);
        --penned-code-gutter: var(--penned-code-gutter-light);
        --penned-code-lineNumber: var(--penned-code-lineNumber-light);
        --penned-code-selection: var(--penned-code-selection-light);
        --penned-code-keyword: var(--penned-code-keyword-light);
        --penned-code-string: var(--penned-code-string-light);
        --penned-code-comment: var(--penned-code-comment-light);
        --penned-code-number: var(--penned-code-number-light);
        --penned-code-type: var(--penned-code-type-light);
        --penned-code-function: var(--penned-code-function-light);
        --penned-code-variable: var(--penned-code-variable-light);
        --penned-code-operator: var(--penned-code-operator-light);
      }
      .penned-code-line {
        display: grid; grid-template-columns: var(--penned-code-gutter-width) minmax(0, 1fr);
        min-height: 1lh;
      }
      .penned-code-number {
        color: var(--penned-code-lineNumber); text-align: right; padding-inline-end: .75ch;
        border-inline-end: 1px solid color-mix(in srgb, var(--penned-code-text) 8%, transparent);
        user-select: none;
      }
      .penned-code-text { padding-inline: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .penned-code-viewer:focus-visible { outline: 2px solid #a970ff; outline-offset: 2px; }
    </style>
